<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>hiyorimail — kotak masuk</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f7f2ea;
    --card: #fffdf9;
    --ink: #2e2438;
    --ink-soft: #6b5c74;
    --amber: #c08a3d;
    --amber-soft: #f1e2c8;
    --moss: #4f7a5b;
    --moss-soft: #dfeee2;
    --rule: #e4d9cc;
    --shadow: 0 24px 60px -30px rgba(46, 36, 56, 0.35);

    /* Warna status inbox: hijau tua = belum dibaca, biru tua = sudah dibaca */
    --unread-bg: #1f4d3a;
    --unread-bg-hover: #26593f;
    --unread-fg: #eafaf0;
    --unread-fg-soft: #b9d9c6;
    --read-bg: #1c2a44;
    --read-bg-hover: #22314f;
    --read-fg: #e7ecf8;
    --read-fg-soft: #9fb0d1;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(192, 138, 61, 0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(79, 122, 91, 0.07), transparent 40%);
    color: var(--ink);
    font-family: "Work Sans", system-ui, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 30px 26px 26px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }

  .eyebrow .brand { display: flex; align-items: center; gap: 7px; }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 0 rgba(192, 138, 61, 0.5);
    animation: pulse 2.2s ease-in-out infinite;
  }
  .live-dot.found { background: var(--moss); box-shadow: 0 0 0 0 rgba(79, 122, 91, 0.5); }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(192, 138, 61, 0.45); }
    70% { box-shadow: 0 0 0 7px rgba(192, 138, 61, 0); }
    100% { box-shadow: 0 0 0 0 rgba(192, 138, 61, 0); }
  }
  .live-dot.found { animation-name: pulseFound; }
  @keyframes pulseFound {
    0% { box-shadow: 0 0 0 0 rgba(79, 122, 91, 0.45); }
    70% { box-shadow: 0 0 0 7px rgba(79, 122, 91, 0); }
    100% { box-shadow: 0 0 0 0 rgba(79, 122, 91, 0); }
  }

  .address-chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--paper);
    border: 1px dashed var(--rule);
    border-radius: 12px;
    padding: 12px 14px;
    word-break: break-all;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
  }

  .address-chip button {
    flex: none;
    border: none;
    background: none;
    color: var(--ink-soft);
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .address-chip button:hover { background: var(--amber-soft); color: var(--ink); }
  .address-chip button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .toolbar .count {
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .toolbar .count strong { color: var(--ink); }

  .icon-btn {
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink-soft);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12.5px;
    font-family: "Work Sans", sans-serif;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { background: var(--amber-soft); color: var(--ink); }
  .icon-btn .spin { display: inline-block; transition: transform 0.5s ease; }
  .icon-btn.spinning .spin { animation: spin 0.6s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    display: none;
    background: #fbeaea;
    border: 1px solid #e7c3c3;
    color: #7a2c2c;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 12.5px;
    margin-bottom: 14px;
  }
  .error-box.show { display: block; }

  /* ---------- INBOX LIST ---------- */
  .inbox-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg {
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 20px -14px rgba(0, 0, 0, 0.4);
  }

  .msg-row {
    width: 100%;
    text-align: left;
    border: none;
    cursor: pointer;
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "Work Sans", sans-serif;
    transition: background 0.15s ease;
  }

  /* Belum dibaca = hijau tua */
  .msg.is-unread .msg-row {
    background: var(--unread-bg);
    color: var(--unread-fg);
  }
  .msg.is-unread .msg-row:hover { background: var(--unread-bg-hover); }
  .msg.is-unread .msg-from { color: var(--unread-fg); font-weight: 600; }
  .msg.is-unread .msg-subject { color: var(--unread-fg); font-weight: 600; }
  .msg.is-unread .msg-snippet { color: var(--unread-fg-soft); }
  .msg.is-unread .msg-time { color: var(--unread-fg-soft); }

  /* Sudah dibaca = biru tua */
  .msg.is-read .msg-row {
    background: var(--read-bg);
    color: var(--read-fg);
  }
  .msg.is-read .msg-row:hover { background: var(--read-bg-hover); }
  .msg.is-read .msg-from { color: var(--read-fg-soft); font-weight: 500; }
  .msg.is-read .msg-subject { color: var(--read-fg-soft); font-weight: 500; }
  .msg.is-read .msg-snippet { color: var(--read-fg-soft); opacity: 0.75; }
  .msg.is-read .msg-time { color: var(--read-fg-soft); }

  .msg-dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffffff;
    opacity: 0.9;
  }
  .msg.is-read .msg-dot { opacity: 0; }

  .msg-main { flex: 1; min-width: 0; }
  .msg-line1 {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .msg-from {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .msg-time {
    flex: none;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
  }
  .msg-subject {
    font-size: 13.5px;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .msg-snippet {
    font-size: 12px;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .msg-detail {
    display: none;
    background: var(--card);
    color: var(--ink);
    border-top: 1px solid var(--rule);
    padding: 14px 16px 16px;
  }
  .msg.is-open .msg-detail { display: block; }

  .msg-detail .field { display: flex; gap: 8px; font-size: 12.5px; margin-bottom: 6px; }
  .msg-detail .label { flex: none; width: 54px; color: var(--ink-soft); font-weight: 500; }
  .msg-detail .value { color: var(--ink); word-break: break-word; }
  .msg-detail .value.mono { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; }

  .msg-body {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-inline-link {
    color: var(--moss);
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 2px;
    word-break: break-all;
  }
  .msg-inline-link:hover { color: var(--ink); }

  .msg-inline-copy {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink-soft);
    border-radius: 7px;
    width: 22px;
    height: 22px;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    margin-left: 4px;
    vertical-align: middle;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .msg-inline-copy:hover { background: var(--amber-soft); color: var(--ink); }
  .msg-inline-copy.copied { color: var(--moss); border-color: var(--moss); }

  .msg-open-link {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 16px;
    border-radius: 10px;
    background: var(--moss);
    color: #fdfaf5;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
  }
  .msg-open-link:hover { transform: translateY(-1px); }

  .empty-inbox {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 26px 10px;
    border: 1px dashed var(--rule);
    border-radius: 14px;
  }

  .no-email {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13.5px;
    line-height: 1.6;
  }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 18px;
    font-family: "IBM Plex Mono", monospace;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="eyebrow">
    <span class="brand">✉ hiyorimail<span id="liveDot" class="live-dot"></span></span>
    <span id="clock">--:--:--</span>
  </div>

  <div id="mainContent">
    <div id="noEmailBox" class="no-email" style="display:none;">
      Gak ada alamat email yang ditentukan.<br />Buka halaman ini lewat link yang dikasih bot ya.
    </div>

    <div id="withEmailBox" style="display:none;">
      <div class="address-chip">
        <span id="emailText">-</span>
        <button id="copyBtn" type="button">SALIN</button>
      </div>

      <div class="toolbar">
        <span class="count" id="countText">Menunggu email masuk…</span>
        <button type="button" class="icon-btn" id="refreshBtn">
          <span class="spin" id="refreshIcon">↻</span> Cek sekarang
        </button>
      </div>

      <div class="error-box" id="errorBox"></div>

      <div id="emptyInbox" class="empty-inbox">Belum ada email masuk. Halaman ini otomatis cek ulang tiap beberapa detik.</div>

      <div class="inbox-list" id="inboxList"></div>
    </div>
  </div>

  <footer>generator.hiyorimail.biz.id</footer>
</div>

<script>
(function () {
  var POLL_MS = 4000;
  var params = new URLSearchParams(window.location.search);
  var email = (params.get("email") || "").trim().toLowerCase();
  var sig = (params.get("sig") || "").trim();
  var card = document.getElementById("card");

  function tickClock() {
    var d = new Date();
    document.getElementById("clock").textContent = d.toLocaleTimeString("id-ID", { hour12: false });
  }
  tickClock();
  setInterval(tickClock, 1000);

  function showTerminalError(msg) {
    document.getElementById("withEmailBox").style.display = "none";
    var box = document.getElementById("noEmailBox");
    box.textContent = msg;
    box.style.display = "block";
  }

  if (!email || email.indexOf("@") === -1) {
    showTerminalError("Gak ada alamat email yang ditentukan. Buka halaman ini lewat link yang dikasih bot ya.");
    return;
  }

  if (!sig) {
    showTerminalError("Tautan ini gak lengkap/gak valid. Buka halaman ini lewat link yang dikasih bot ya.");
    return;
  }

  document.getElementById("withEmailBox").style.display = "block";
  document.getElementById("emailText").textContent = email;

  var liveDot = document.getElementById("liveDot");
  var countText = document.getElementById("countText");
  var errorBox = document.getElementById("errorBox");
  var emptyInbox = document.getElementById("emptyInbox");
  var inboxList = document.getElementById("inboxList");
  var refreshBtn = document.getElementById("refreshBtn");
  var pollTimer = null;

  // ---- status baca disimpan per-browser (localStorage), per alamat email ----
  var READ_KEY = "hiyorimail_read::" + email;
  var openId = null; // pesan yang lagi dibuka/di-expand

  function loadReadSet() {
    try {
      var raw = localStorage.getItem(READ_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) {
      return new Set();
    }
  }
  function saveReadSet(set) {
    try {
      localStorage.setItem(READ_KEY, JSON.stringify(Array.from(set)));
    } catch (e) { /* abaikan kalau storage penuh/disabled */ }
  }
  var readSet = loadReadSet();

  document.getElementById("copyBtn").addEventListener("click", function () {
    navigator.clipboard.writeText(email).then(function () {
      var btn = document.getElementById("copyBtn");
      var original = btn.textContent;
      btn.textContent = "TERSALIN";
      setTimeout(function () { btn.textContent = original; }, 1500);
    });
  });

  function fmtTime(ms) {
    if (!ms) return "-";
    var d = new Date(ms);
    return d.toLocaleString("id-ID", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit" }) + " WIB";
  }

  function setError(msg) {
    if (!msg) {
      errorBox.classList.remove("show");
      errorBox.textContent = "";
      return;
    }
    errorBox.classList.add("show");
    errorBox.textContent = msg;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Worker nyimpen link yang nempel di teks email (misal tombol/anchor
  // "Login ke Alight Creative") sebagai penanda "{{LINK|teks|href}}" di
  // dalam body. Fungsi ini nge-render body itu jadi HTML aman: teks biasa
  // di-escape seperti biasa, tapi tiap penanda link diubah jadi <a> yang
  // beneran bisa diklik + tombol kecil buat nyalin URL-nya.
  function renderBodyWithLinks(raw) {
    var escaped = escapeHtml(raw);
    return escaped.replace(/\{\{LINK\|([\s\S]*?)\|([\s\S]*?)\}\}/g, function (_, text, href) {
      return (
        '<a href="' + href + '" target="_blank" rel="noopener" class="msg-inline-link">' + text + '</a>' +
        '<button type="button" class="msg-inline-copy" data-copy-link="' + href + '" title="Salin link">⧉</button>'
      );
    });
  }

  function markRead(id) {
    if (!readSet.has(id)) {
      readSet.add(id);
      saveReadSet(readSet);
    }
  }

  function toggleMessage(id) {
    openId = (openId === id) ? null : id;
    markRead(id);
    render(lastMessages || []);
  }

  var lastMessages = [];

  function render(messages) {
    lastMessages = messages;
    var unreadCount = messages.filter(function (m) { return !readSet.has(m.id); }).length;

    if (messages.length === 0) {
      emptyInbox.style.display = "block";
      inboxList.innerHTML = "";
      countText.textContent = "Menunggu email masuk…";
      liveDot.classList.remove("found");
      return;
    }

    emptyInbox.style.display = "none";
    liveDot.classList.add("found");
    countText.innerHTML = "<strong>" + messages.length + "</strong> pesan" +
      (unreadCount > 0 ? " · <strong>" + unreadCount + "</strong> belum dibaca" : " · semua sudah dibaca");

    var html = messages.map(function (m) {
      var isRead = readSet.has(m.id);
      var isOpen = openId === m.id;
      var stateClass = (isRead ? "is-read" : "is-unread") + (isOpen ? " is-open" : "");
      var linkHtml = m.link
        ? '<a href="' + escapeHtml(m.link) + '" target="_blank" rel="noopener" class="msg-open-link">Buka Link Verifikasi →</a>'
        : "";
      var bodyHtml = m.body
        ? '<div class="msg-body">' + renderBodyWithLinks(m.body) + "</div>"
        : "";

      return (
        '<div class="msg ' + stateClass + '" data-id="' + escapeHtml(m.id) + '">' +
          '<button type="button" class="msg-row" data-toggle="' + escapeHtml(m.id) + '">' +
            '<span class="msg-dot"></span>' +
            '<span class="msg-main">' +
              '<span class="msg-line1">' +
                '<span class="msg-from">' + escapeHtml(m.from || "(tanpa pengirim)") + '</span>' +
                '<span class="msg-time">' + escapeHtml(fmtTime(m.receivedAt)) + '</span>' +
              '</span>' +
              '<div class="msg-subject">' + escapeHtml(m.subject || "(tanpa subjek)") + '</div>' +
              (m.snippet ? '<div class="msg-snippet">' + escapeHtml(m.snippet) + '</div>' : "") +
            '</span>' +
          '</button>' +
          '<div class="msg-detail">' +
            '<div class="field"><span class="label">Dari</span><span class="value mono">' + escapeHtml(m.from || "-") + '</span></div>' +
            '<div class="field"><span class="label">Subjek</span><span class="value">' + escapeHtml(m.subject || "-") + '</span></div>' +
            '<div class="field"><span class="label">Waktu</span><span class="value mono">' + escapeHtml(fmtTime(m.receivedAt)) + '</span></div>' +
            bodyHtml +
            linkHtml +
          '</div>' +
        '</div>'
      );
    }).join("");

    inboxList.innerHTML = html;

    inboxList.querySelectorAll("[data-toggle]").forEach(function (el) {
      el.addEventListener("click", function () {
        toggleMessage(el.getAttribute("data-toggle"));
      });
    });

    inboxList.querySelectorAll("[data-copy-link]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        var url = el.getAttribute("data-copy-link");
        navigator.clipboard.writeText(url).then(function () {
          var original = el.textContent;
          el.textContent = "✓";
          el.classList.add("copied");
          setTimeout(function () {
            el.textContent = original;
            el.classList.remove("copied");
          }, 1200);
        });
      });
    });
  }

  async function checkOnce(manual) {
    if (manual) refreshBtn.classList.add("spinning");
    try {
      var qs = "email=" + encodeURIComponent(email) + "&sig=" + encodeURIComponent(sig);
      var res = await fetch("/api/inbox?" + qs, { cache: "no-store" });
      var data = await res.json();

      if (!res.ok) {
        if (data.terminal) {
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
          showTerminalError(data.error || "Tautan ini gak valid.");
          return;
        }
        setError(data.error || "Gagal cek inbox, coba lagi.");
        return;
      }

      setError(null);
      render(Array.isArray(data.messages) ? data.messages : []);
    } catch (e) {
      setError("Gagal konek ke server. Cek koneksi internet kamu.");
    } finally {
      if (manual) setTimeout(function () { refreshBtn.classList.remove("spinning"); }, 600);
    }
  }

  refreshBtn.addEventListener("click", function () { checkOnce(true); });

  checkOnce(false);
  pollTimer = setInterval(function () { checkOnce(false); }, POLL_MS);
})();
</script>

</body>
</html>
